spring.application.name=jcrm
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-message=never
jcrm.database=${JCRM_DB_PATH:data/jcrm.db}
spring.threads.virtual.enabled=true
logging.level.com.jcrm=INFO
server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,image/svg+xml
server.compression.min-response-size=1024
