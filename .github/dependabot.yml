version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Add maven/gradle (and others) here once the project has build files.
  # Ecosystems with no manifest in the repo make Dependabot runs fail with
  # "dependency_file_not_found".
